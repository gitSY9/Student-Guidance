<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>아침선도 적발 기록</title>
<style>
  :root{
    --bg:#f4f5f7; --card:#ffffff; --line:#e3e5ea; --text:#1d2433;
    --muted:#6b7280; --primary:#312783; --primary-d:#251d66; --ok:#0f9d58;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
       background:var(--bg); color:var(--text); padding:16px; line-height:1.5;}
  .wrap{max-width:480px; margin:0 auto;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px;}
  .head{display:flex; align-items:center; gap:10px; margin-bottom:18px;}
  .head .ic{width:40px;height:40px;border-radius:10px;background:#eceaf8;color:var(--primary);
            display:flex;align-items:center;justify-content:center;font-size:20px;}
  .head h1{font-size:18px; margin:0; font-weight:600;}
  .head p{font-size:12px; color:var(--muted); margin:2px 0 0;}
  label{display:block; font-size:13px; color:var(--muted); margin:0 0 5px; font-weight:500;}
  input,select{width:100%; height:46px; padding:0 12px; font-size:16px; border:1px solid var(--line);
               border-radius:10px; background:#fff; color:var(--text); margin-bottom:13px; outline:none;}
  input:focus,select:focus{border-color:var(--primary); box-shadow:0 0 0 3px rgba(49,39,131,.14);}
  .row{display:flex; gap:10px;}
  .row > div{flex:1;}
  .hidden{display:none;}
  button.submit{width:100%; height:50px; border:none; border-radius:11px; background:var(--primary);
                color:#fff; font-size:16px; font-weight:600; cursor:pointer; transition:.15s;}
  button.submit:active{transform:scale(.98); background:var(--primary-d);}
  button.submit:disabled{opacity:.6;}
  .grid{display:grid; gap:8px; margin-bottom:13px;}
  .grid.dept{grid-template-columns:repeat(5, 1fr);}
  .grid.two{grid-template-columns:repeat(2, 1fr);}
  .grid.three{grid-template-columns:repeat(3, 1fr);}
  .chip{height:46px; border:1px solid var(--line); border-radius:10px; background:#fff;
        color:var(--text); font-size:15px; font-weight:500; cursor:pointer; transition:.12s;
        display:flex; align-items:center; justify-content:center; padding:0;}
  .chip:active{transform:scale(.96);}
  .chip.on{background:var(--primary); color:#fff; border-color:var(--primary);}
  .grid.dept .chip{font-size:14px;}
  .grid.three .chip, .grid.two .chip{font-size:14px;}
  .grid.reason{grid-template-columns:repeat(2, 1fr);}
  .grid.reason .chip{height:44px; font-size:14px;}
  .toast{position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(40px);
         background:#1d2433; color:#fff; padding:13px 20px; border-radius:10px; font-size:14px;
         opacity:0; transition:.3s; pointer-events:none; z-index:9;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  .toast.ok{background:var(--ok);}
  .log{margin-top:16px;}
  .log h2{font-size:13px; color:var(--muted); margin:0 0 8px; font-weight:600;}
  .log .item{font-size:13px; padding:8px 10px; background:#f8f9fb; border-radius:8px; margin-bottom:6px;
             display:flex; justify-content:space-between; gap:8px;}
  .log .item span{color:var(--muted);}
  .count{font-size:12px; color:var(--muted); text-align:center; margin-top:14px;}
  .userbar{margin-left:auto; text-align:right; font-size:13px; line-height:1.4;}
  .userbar b{display:block;}
  .linkbtn{border:none; background:none; padding:0; color:var(--muted); font-size:12px;
           text-decoration:underline; cursor:pointer;}
  .brand{text-align:center; padding:22px 0 20px;}
  .brand img{width:132px; height:auto; display:block; margin:0 auto;}
  .brand h1{font-size:21px; margin:14px 0 2px; font-weight:700; color:var(--primary); letter-spacing:-.3px;}
  .brand p{font-size:14px; color:var(--muted); margin:0;}
  .err{color:#c0392b; font-size:13px; min-height:20px; margin:-4px 0 8px;}
  .namebtn{width:100%; height:46px; padding:0 12px; font-size:16px; border:1px solid var(--line);
           border-radius:10px; background:#fff; color:var(--muted); text-align:left; margin-bottom:13px; cursor:pointer;}
  .namebtn.set{color:var(--text); font-weight:600;}
  .picker{position:fixed; inset:0; background:var(--bg); z-index:20; overflow-y:auto; padding:14px;}
  .picker-head{display:flex; justify-content:flex-end; align-items:center; max-width:480px;
               margin:0 auto 4px; font-size:16px;}
  .picker-head .linkbtn{font-size:14px; padding:6px;}
  .picker-list{max-width:480px; margin:0 auto;}
  .picker-row{display:flex; gap:6px; padding:5px 0; border-top:1px solid var(--line); align-items:flex-start;}
  .picker-row:first-child{border-top:none;}
  .picker-dept{flex:0 0 46px; height:34px; display:flex; align-items:center; font-size:13px;
               font-weight:700; color:var(--primary);}
  .picker-grid{flex:1; display:grid; grid-template-columns:repeat(5, 1fr); gap:5px;}
  .picker-grid .chip{height:34px; font-size:13px;}
  .picker-grid .chip.leader{background:#fdf1cf; border-color:#eda405; color:#5c3d00; font-weight:700;}
  .picker-grid .chip.president{background:#fdf1cf; color:#5c3d00; font-weight:700; border:3px double #eda405;}
  .out{font-family:monospace; font-size:12px; background:#f8f9fb; border:1px solid var(--line);
       border-radius:8px; padding:10px; word-break:break-all; min-height:40px; user-select:all;}
</style>
</head>
<body>
<div class="wrap">
  <!-- 로그인 화면 -->
  <div class="brand" id="brand">
    <img id="logo" alt="삼일공업고등학교 교표" width="132" height="131">
    <h1>제39대 학생자치운영위원회</h1>
    <p>아침선도 적발 기록</p>
  </div>
  <div class="card" id="loginCard">
    <label>이름</label>
    <input id="loginName" type="text" placeholder="이름" autocomplete="off">
    <label>비밀번호</label>
    <input id="loginPw" type="password" inputmode="numeric" pattern="[0-9]*" placeholder="비밀번호 (숫자)" autocomplete="off">
    <div class="err" id="loginErr"></div>
    <button class="submit" id="loginBtn">학생회 인증</button>
  </div>

  <!-- 이름 선택 화면 (명단이 있을 때 이름 칸을 누르면 열림) -->
  <div class="picker hidden" id="picker">
    <div class="picker-head">
      <button class="linkbtn" id="pickerClose">닫기</button>
    </div>
    <div class="picker-list" id="pickerGrid"></div>
  </div>

  <!-- 비밀번호 바꾸기 도구: 주소 끝에 ?admin 을 붙이면 보입니다 -->
  <div class="card hidden" id="adminCard" style="margin-top:14px;">
    <label>비밀번호 바꾸기 (교사용)</label>
    <input id="admPw" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="새 공통 비밀번호 (숫자만)" autocomplete="off">
    <button class="submit" id="admBtn" style="margin-bottom:12px;">새 줄 만들기</button>
    <div class="out" id="admOut"></div>
    <p style="font-size:12px; color:var(--muted); margin:8px 0 0;">위에 나온 한 줄로 index.html의 <b>const PASSWORD_HASH = ...</b> 줄을 통째로 교체하세요.</p>
  </div>

  <!-- 기록 화면 -->
  <div class="card hidden" id="mainCard">
    <div class="head">
      <div class="ic">✓</div>
      <div>
        <h1>아침선도 적발 기록</h1>
        <p id="dateLabel">학생회 선도활동</p>
      </div>
      <div class="userbar">
        <b id="userName"></b>
        <button class="linkbtn" id="logoutBtn">로그아웃</button>
      </div>
    </div>

    <label>학과</label>
    <div class="grid dept" id="deptGrid"></div>

    <div class="row">
      <div>
        <label>학년</label>
        <div class="grid three" id="gradeGrid"></div>
      </div>
      <div>
        <label>반</label>
        <div class="grid two" id="clsGrid"></div>
      </div>
    </div>

    <label>학생 이름</label>
    <input id="name" type="text" placeholder="예: 홍길동" autocomplete="off">

    <label>적발 사유</label>
    <div class="grid reason" id="reasonGrid"></div>
    <input id="reasonEtc" class="hidden" type="text" placeholder="기타 사유를 입력하세요" autocomplete="off">

    <button class="submit" id="btn">제출</button>

    <div class="count" id="count">오늘 제출 0건</div>

    <div class="log" id="logBox" style="display:none;">
      <h2>방금 제출한 내역</h2>
      <div id="logList"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ===== 구글 폼 전송 설정 ===== */
const GFORM = {
  action: "https://docs.google.com/forms/d/e/1FAIpQLSeNs8GJ06hvSF9ux7pNtcDSuPKCnwI67Mdb6Nf831KDm3kmZQ/formResponse",
  reporter:   "entry.181106944",  // 입력자
  dept:       "entry.2061918714", // 학과
  gradeClass: "entry.848626728",  // 학년-반
  name:       "entry.1653767513", // 학생 이름
  reason:     "entry.396807588"   // 적발 사유
};
/* ============================= */

/* ===== 공통 비밀번호 =====
   비밀번호를 바꾸려면: 사이트 주소 끝에 ?admin 을 붙여 열고,
   '비밀번호 바꾸기'에서 나온 한 줄로 아래 줄을 통째로 교체하세요. */
const PASSWORD_HASH = "e28d6d18a97231549b13551cb64ff0fe38f3f15ce5cbfc99404a09962e6b4799";
/* ========================== */

/* ===== 학생회 명단 (학과별) =====
   "학과": ["이름","이름", ...],  형식입니다.
   이름을 넣거나 뺄 때 따옴표와 쉼표를 지켜주세요. 학과 순서대로 화면에 나옵니다.
   이름 앞에 * 를 붙이면 학과 대표(노란 버튼), ** 를 붙이면 학생회장(노란 버튼 + 이중 테두리)으로 표시됩니다. */
const MEMBERS = {
  "화공":   ["*김나현","김도희","유제현","박수빈","오새벽","최서윤"],
  "환경":   ["*박규태","강성현","김도희","허옥문"],
  "로봇":   ["*박태환","김선호","서지호","권하겸","김민하","이서준"],
  "소방":   ["*김호민","강정후","심현교","정서영","이림환","이민준","정운비","정원결"],
  "전자":   ["*방용태","배준후","음우진","장성윤","추민성"],
  "사물":   ["*김하율","김동현","이수혁","강민서","김민기","모준후","손우빈","유승하","최태규"],
  "콘텐츠": ["*이준석","김경록","박시훈","우현준","이수인","장하음","황은휘"],
  "경찰":   ["*김학래","문세영","성은지","이윤정"],
  "레저":   ["**이창민","배은솔","오수현","윤주영","이서연","이예원"],
  "반도체": ["*이진성","이준규","임준교","정민준","정현우"]
};
// 입력자로 기록되는 값은 "학과 이름" (예: 화공 김도희) — 같은 이름이 있어도 구분됩니다
const MEMBER_LIST = [];
Object.entries(MEMBERS).forEach(([d, arr]) => arr.forEach(n => MEMBER_LIST.push(d + " " + n.replace(/^\*+/, ""))));
/* ========================== */

const $ = id => document.getElementById(id);
let todayCount = 0;
let currentUser = null;

/* SHA-256 (비밀번호를 그대로 저장하지 않기 위한 변환) */
function sha256(str){
  const r = (x,n)=>(x>>>n)|(x<<(32-n));
  const K = [];
  for(let p=2; K.length<64; p++){
    let prime = true;
    for(let d=2; d*d<=p; d++) if(p%d===0){ prime=false; break; }
    if(prime){ const c = Math.cbrt(p); K.push(Math.floor((c-Math.floor(c))*4294967296)|0); }
  }
  let H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const bytes = Array.from(new TextEncoder().encode(str));
  const bits = bytes.length*8;
  bytes.push(0x80);
  while(bytes.length%64 !== 56) bytes.push(0);
  for(let i=7;i>=0;i--) bytes.push(i>=4 ? 0 : (bits>>>(i*8))&255);
  for(let o=0;o<bytes.length;o+=64){
    const w=[];
    for(let i=0;i<16;i++) w[i]=(bytes[o+i*4]<<24)|(bytes[o+i*4+1]<<16)|(bytes[o+i*4+2]<<8)|bytes[o+i*4+3];
    for(let i=16;i<64;i++){
      const s0=r(w[i-15],7)^r(w[i-15],18)^(w[i-15]>>>3);
      const s1=r(w[i-2],17)^r(w[i-2],19)^(w[i-2]>>>10);
      w[i]=(w[i-16]+s0+w[i-7]+s1)|0;
    }
    let [a,b,c,d,e,f,g,h]=H;
    for(let i=0;i<64;i++){
      const t1=(h+(r(e,6)^r(e,11)^r(e,25))+((e&f)^(~e&g))+K[i]+w[i])|0;
      const t2=((r(a,2)^r(a,13)^r(a,22))+((a&b)^(a&c)^(b&c)))|0;
      h=g; g=f; f=e; e=(d+t1)|0; d=c; c=b; b=a; a=(t1+t2)|0;
    }
    const n=[a,b,c,d,e,f,g,h];
    H=H.map((v,i)=>(v+n[i])|0);
  }
  return H.map(v=>(v>>>0).toString(16).padStart(8,"0")).join("");
}
const pwHash = pw => sha256("seondo:" + pw);

/* 로그인 / 로그아웃 */
function saveLogin(v){
  try{ v ? localStorage.setItem("seondoLogin", JSON.stringify(v)) : localStorage.removeItem("seondoLogin"); }catch(e){}
}
function loadLogin(){
  try{ return JSON.parse(localStorage.getItem("seondoLogin")); }catch(e){ return null; }
}
function showMain(name){
  currentUser = name;
  $("userName").textContent = name;
  $("brand").classList.add("hidden");
  $("loginCard").classList.add("hidden");
  $("adminCard").classList.add("hidden");
  $("mainCard").classList.remove("hidden");
}
function doLogin(){
  const name = $("loginName").value.trim();
  const pw = $("loginPw").value;
  if(!name || !pw){ $("loginErr").textContent = "이름과 비밀번호를 입력하세요"; return; }
  const h = pwHash(pw);
  if(h !== PASSWORD_HASH){
    $("loginErr").textContent = "비밀번호가 맞지 않습니다";
    $("loginPw").value = "";
    return;
  }
  $("loginErr").textContent = "";
  $("loginPw").value = "";
  saveLogin({ name, h });
  showMain(name);
}
// 명단이 있으면 이름 칸을 '누르면 전체 명단이 펼쳐지는 버튼'으로 바꿈
if(MEMBER_LIST.length){
  const nb = document.createElement("button");
  nb.type = "button";
  nb.id = "loginName";
  nb.className = "namebtn";
  nb.value = "";
  nb.textContent = "이름 선택";
  $("loginName").replaceWith(nb);
  nb.addEventListener("click", ()=> $("picker").classList.remove("hidden"));
  $("pickerClose").addEventListener("click", ()=> $("picker").classList.add("hidden"));
  Object.entries(MEMBERS).forEach(([d, arr])=>{
    if(!arr.length) return;
    const row = document.createElement("div");
    row.className = "picker-row";
    const lab = document.createElement("div");
    lab.className = "picker-dept";
    lab.textContent = d;
    const g = document.createElement("div");
    g.className = "picker-grid";
    arr.forEach(raw=>{
      const n = raw.replace(/^\*+/, "");
      const c = document.createElement("button");
      c.type = "button";
      c.className = raw.startsWith("**") ? "chip president" : raw.startsWith("*") ? "chip leader" : "chip";
      c.textContent = n;
      c.addEventListener("click", ()=>{
        nb.value = d + " " + n;
        nb.textContent = d + " " + n;
        nb.classList.add("set");
        $("picker").classList.add("hidden");
        $("loginErr").textContent = "";
        $("loginPw").focus();
      });
      g.appendChild(c);
    });
    row.append(lab, g);
    $("pickerGrid").appendChild(row);
  });
}
$("loginBtn").addEventListener("click", doLogin);
$("loginPw").addEventListener("keydown", e=>{ if(e.key === "Enter") doLogin(); });
$("logoutBtn").addEventListener("click", ()=>{
  saveLogin(null);
  currentUser = null;
  $("mainCard").classList.add("hidden");
  $("brand").classList.remove("hidden");
  $("loginCard").classList.remove("hidden");
  $("loginName").focus();
});
// 이전에 로그인한 기기는 자동 로그인 (비밀번호가 바뀌면 다시 로그인)
(function(){
  const s = loadLogin();
  if(new URLSearchParams(location.search).has("admin")) $("adminCard").classList.remove("hidden");
  else if(s && s.name && s.h === PASSWORD_HASH && (!MEMBER_LIST.length || MEMBER_LIST.includes(s.name))) showMain(s.name);
})();
$("admBtn").addEventListener("click", ()=>{
  const pw = $("admPw").value.trim();
  if(!/^[0-9]+$/.test(pw)){ $("admOut").textContent = "새 비밀번호를 숫자로만 입력하세요"; return; }
  $("admOut").textContent = `const PASSWORD_HASH = "${pwHash(pw)}";`;
});

/* 학과 10개 / 학년 3개 / 반 2개 버튼 생성 */
const DEPTS = ["화공","환경","로봇","소방","전자","사물","콘텐츠","경찰","레저","반도체"];
const REASONS = ["넥타이 미착용","치마로고 없음","교복 미착용","동복·하복 혼용","단체티 혼용","체육복 등교","체육복 혼용","크록스·슬리퍼 등교","진한 화장","귀걸이·피어싱","기타"];
const sel = { dept:null, grade:null, cls:null, reasons:[] };

function buildGrid(boxId, items, key, defaultIdx){
  const box = $(boxId);
  items.forEach((it, i)=>{
    const label = typeof it === "object" ? it.label : it;
    const value = typeof it === "object" ? it.value : it;
    const b = document.createElement("button");
    b.className = "chip";
    b.textContent = label;
    b.addEventListener("click", ()=>{
      box.querySelectorAll(".chip").forEach(c=>c.classList.remove("on"));
      b.classList.add("on");
      sel[key] = value;
    });
    box.appendChild(b);
    if(defaultIdx === i){ b.classList.add("on"); sel[key] = value; }
  });
}
buildGrid("deptGrid", DEPTS, "dept");
buildGrid("gradeGrid", [
  {label:"1학년", value:"1"},
  {label:"2학년", value:"2"},
  {label:"3학년", value:"3"}
], "grade");
buildGrid("clsGrid", [
  {label:"1반", value:"1"},
  {label:"2반", value:"2"}
], "cls");

/* 적발 사유 버튼 (중복 선택 가능, 기타 선택 시 직접입력 칸 표시) */
(function buildReasons(){
  const box = $("reasonGrid");
  REASONS.forEach(label=>{
    const b = document.createElement("button");
    b.className = "chip";
    b.textContent = label;
    b.addEventListener("click", ()=>{
      const i = sel.reasons.indexOf(label);
      if(i === -1){ sel.reasons.push(label); b.classList.add("on"); }
      else { sel.reasons.splice(i, 1); b.classList.remove("on"); }
      const etcOn = sel.reasons.includes("기타");
      $("reasonEtc").classList.toggle("hidden", !etcOn);
      if(etcOn) $("reasonEtc").focus();
    });
    box.appendChild(b);
  });
})();

// 날짜 표시
const now = new Date();
$("dateLabel").textContent =
  `${now.getMonth()+1}월 ${now.getDate()}일 선도활동`;

// 사유: 선택된 항목들을 쉼표로 결합. 기타는 직접입력 값으로 치환
function getReason(){
  const etc = $("reasonEtc").value.trim();
  const list = sel.reasons.map(r => r === "기타" ? etc : r).filter(Boolean);
  return list.join(", ");
}

function toast(msg, ok){
  const t = $("toast");
  t.textContent = msg;
  t.className = "toast show" + (ok ? " ok" : "");
  setTimeout(()=>{ t.className = "toast"; }, 2200);
}

$("btn").addEventListener("click", async ()=>{
  const reporter = currentUser;
  const name = $("name").value.trim();
  const reason = getReason();

  if(!reporter){ toast("다시 로그인해 주세요"); return; }
  if(!sel.dept){ toast("학과를 선택하세요"); return; }
  if(!sel.grade){ toast("학년을 선택하세요"); return; }
  if(!sel.cls){ toast("반을 선택하세요"); return; }
  if(!name){ toast("학생 이름을 적어주세요"); $("name").focus(); return; }
  if(sel.reasons.length === 0){ toast("적발 사유를 선택하세요"); return; }
  if(!reason){ toast("기타 사유를 입력하세요"); $("reasonEtc").focus(); return; }

  const data = {
    reporter,
    dept: sel.dept,
    gradeClass: `${sel.grade}-${sel.cls}`,
    name,
    reason
  };

  $("btn").disabled = true;
  $("btn").textContent = "제출 중...";

  try{
    const fd = new FormData();
    fd.append(GFORM.reporter, data.reporter);
    fd.append(GFORM.dept, data.dept);
    fd.append(GFORM.gradeClass, data.gradeClass);
    fd.append(GFORM.name, data.name);
    fd.append(GFORM.reason, data.reason);
    await fetch(GFORM.action, {
      method:"POST",
      mode:"no-cors",
      body: fd
    });
    // no-cors 모드는 응답을 읽을 수 없으므로 제출 성공으로 간주
    todayCount++;
    $("count").textContent = `오늘 제출 ${todayCount}건`;
    addLog(data);
    toast("제출 완료 ✓", true);
    // 다음 입력 위해 학생 이름·사유만 초기화 (입력자/학과/학년/반 유지)
    $("name").value = "";
    sel.reasons = [];
    $("reasonGrid").querySelectorAll(".chip").forEach(c=>c.classList.remove("on"));
    $("reasonEtc").value = "";
    $("reasonEtc").classList.add("hidden");
    $("name").focus();
  }catch(err){
    toast("제출 실패. 인터넷을 확인하세요");
  }finally{
    $("btn").disabled = false;
    $("btn").textContent = "제출";
  }
});

function addLog(d){
  $("logBox").style.display = "block";
  const el = document.createElement("div");
  el.className = "item";
  const b = document.createElement("b");
  b.textContent = `${d.gradeClass} ${d.name}`;
  const s = document.createElement("span");
  s.textContent = d.reason;
  el.append(b, s);
  $("logList").prepend(el);
}
